<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Football Scoreboard</title>


  <!-- CACHE-BUSTING VERSION -->

  <link
    rel="stylesheet"
    href="style.css?v=6"
  >

</head>


<body>


  <div id="scoreboard">


    <!-- ======================================================
         HOME TEAM
    ======================================================= -->

    <div
      id="home-panel"
      class="team-panel home-panel"
    >

      <div class="team-content home-content">


        <img
          id="home-logo"
          class="club-logo"
          src="assets/clubs-and-countries/fulham.png"
          alt=""
        >


        <div
          id="home-name"
          class="team-name"
        >
          FUL
        </div>


        <div
          id="home-score"
          class="score"
        >
          0
        </div>


      </div>

    </div>


    <!-- ======================================================
         CENTRE
    ======================================================= -->

    <div class="centre">


      <div class="competition-wrap">

        <img
          id="competition-logo"
          class="competition-logo"
          src="assets/competitions/premier-league.png"
          alt=""
        >

      </div>


      <div
        id="timer"
        class="timer"
      >
        00:00
      </div>


    </div>


    <!-- ======================================================
         AWAY TEAM
    ======================================================= -->

    <div
      id="away-panel"
      class="team-panel away-panel"
    >

      <div class="team-content away-content">


        <div
          id="away-score"
          class="score"
        >
          0
        </div>


        <div
          id="away-name"
          class="team-name"
        >
          MUN
        </div>


        <img
          id="away-logo"
          class="club-logo"
          src="assets/clubs-and-countries/manchester-united.png"
          alt=""
        >


      </div>

    </div>


  </div>


  <!-- ======================================================
       PEERJS
  ======================================================= -->

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>


  <!-- ======================================================
       SCOREBOARD JAVASCRIPT
  ======================================================= -->

  <script src="overlay.js?v=6"></script>


</body>

</html>
