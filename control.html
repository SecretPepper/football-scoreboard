<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Scoreboard Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0d0f12;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .card {
      background: #181b1f;
      border: 1px solid #2d3238;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 15px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #aaa;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #101010;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #777;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    button:hover {
      background: #444;
    }

    .connect-button {
      width: 100%;
      background: #1677ff;
      padding: 15px;
      font-size: 17px;
    }

    .connect-button:hover {
      background: #3187ff;
    }

    .score-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .score-controls button {
      flex: 1;
    }

    .preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #101010;
    }

    .preview img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .preview-text {
      font-weight: bold;
    }

    .competition-preview {
      min-height: 70px;
      justify-content: center;
    }

    .competition-preview img {
      width: 100px;
      height: 55px;
    }

    .clock {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 10px 0 20px;
    }

    .clock-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #101010;
      color: #aaa;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .connected {
      color: #55d982;
    }

    .disconnected {
      color: #ff6b6b;
    }

    .club-style {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    .obs-link-wrap {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #101010;
    }

    .obs-link-row {
      display: flex;
      gap: 8px;
    }

    .obs-link-row input {
      flex: 1;
      min-width: 0;
      font-size: 13px;
    }

    .secondary-button {
      margin-top: 10px;
      width: 100%;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .clock-buttons {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Football Scoreboard Control</h1>

  <div id="status" class="status disconnected">
    Not connected
  </div>


  <!-- CONNECTION -->

  <div class="card">

    <h2>Connection</h2>

    <div class="field">

      <label>Room name</label>

      <input
        id="room"
        value=""
        placeholder="Generated automatically"
      >

    </div>

    <button
      id="connectButton"
      class="connect-button"
      onclick="connect()"
    >
      CONNECT TO OBS
    </button>

    <div class="obs-link-wrap">
      <label>OBS Browser Source URL</label>

      <div class="obs-link-row">
        <input
          id="obsUrl"
          type="text"
          readonly
          placeholder="Generate a room first"
        >

        <button
          type="button"
          onclick="copyObsUrl()"
        >
          COPY
        </button>
      </div>

      <button
        type="button"
        class="secondary-button"
        onclick="newRoom()"
      >
        NEW OBS LINK / NEW MATCH
      </button>
    </div>

  </div>


  <!-- MATCH -->

  <div class="card">

    <h2>Match</h2>

    <div class="field">

      <label>Competition</label>

      <select id="competition">

        <option value="assets/competitions/premier-league.png">
          Premier League
        </option>

        <option value="assets/competitions/nations-league.png">
          Nations League
        </option>

      </select>

      <div class="preview competition-preview">
        <img id="competitionPreview" alt="">
      </div>

    </div>

  </div>


  <!-- TEAMS -->

  <div class="grid">


    <!-- HOME -->

          <option value="leeds">Leeds United</option>

    <!-- AWAY -->

    <div class="card">

      <h2>Away Team</h2>

      <div class="field">

        <label>Club</label>

        <select id="awayClub">

          <option value="" selected disabled>Choose a club...</option>
          <option value="fulham">Fulham</option>
          <option value="manchester-united">Manchester United</option>
          <option value="arsenal">Arsenal</option>
          <option value="chelsea">Chelsea</option>
          <option value="liverpool">Liverpool</option>
          <option value="manchester-city">Manchester City</option>
          <option value="tottenham">Tottenham Hotspur</option>
          <option value="newcastle">Newcastle United</option>
          <option value="brighton">Brighton</option>
          <option value="aston-villa">Aston Villa</option>
          <option value="west-ham">West Ham United</option>
          <option value="crystal-palace">Crystal Palace</option>
          <option value="everton">Everton</option>
          <option value="wolves">Wolverhampton Wanderers</option>
          <option value="nottingham-forest">Nottingham Forest</option>
          <option value="brentford">Brentford</option>
          <option value="bournemouth">Bournemouth</option>
          <option value="leicester">Leicester City</option>
          <option value="leeds">Leeds United</option>
          <option value="sunderland">Sunderland</option>
          <option value="netherlands">Netherlands</option>
          <option value="germany">Germany</option>
          <option value="portugal">Portugal</option>
          <option value="wales">Wales</option>
          <option value="france">France</option>
          <option value="turkey">Turkey</option>
          <option value="italy">Italy</option>
          <option value="belgium">Belgium</option>
          <option value="england">England</option>
          <option value="spain">Spain</option>
          <option value="slovenia">Slovenia</option>
          <option value="scotland">Scotland</option>

        </select>

        <div id="awayStyle" class="club-style"></div>

      </div>

      <div class="field">

        <label>Short name</label>

        <input
          id="awayName"
          value=""
          maxlength="5"
        >

      </div>

      <div class="field">

        <label>Score</label>

        <input
          id="awayScore"
          type="number"
          min="0"
          value="0"
        >

        <div class="score-controls">

          <button onclick="changeScore('away', -1)">
            −1
          </button>

          <button onclick="changeScore('away', 1)">
            +1
          </button>

        </div>

      </div>

      <div class="preview">

        <img id="awayPreview" alt="">

        <span
          id="awayPreviewName"
          class="preview-text"
        >
          —
        </span>

      </div>

    </div>

  </div>


  <!-- CLOCK -->

  <div class="card">

    <h2>Match Clock</h2>

    <div id="clock" class="clock">
      00:00
    </div>

    <div class="clock-buttons">

      <button onclick="startClock()">START</button>
      <button onclick="pauseClock()">PAUSE</button>
      <button onclick="resetClock()">RESET</button>
      <button onclick="setTime()">SET TIME</button>

    </div>

  </div>

</div>


<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  },

  }

};


/* ============================================================
   STATE
============================================================ */

let state = {

  homeName: "...",
  awayName: "...",

  homeClub: "",
  awayClub: "",

  homeLogo: "assets/clubs-and-countries/default.png",
  awayLogo: "assets/clubs-and-countries/default.png",

  homeColor: "#7a7a7a",
  homeSecondary: "#000000",

  awayColor: "#7a7a7a",
  awaySecondary: "#000000",

  competitionLogo:
    "assets/competitions/premier-league.png",

  homeScore: 0,
  awayScore: 0,

  elapsedMs: 0,
  running: false,
  startedAt: null

};


let peer = null;
let connection = null;
let connecting = false;


const $ = id =>
  document.getElementById(id);


/* ============================================================
   STATUS
============================================================ */

function status(text, connected = false) {

  const el = $("status");

  el.textContent = text;

  el.className =
    connected
      ? "status connected"
      : "status disconnected";

}


/* ============================================================
   BUILD CURRENT STATE
============================================================ */

function buildState() {

  const home =
    CLUBS[$("homeClub").value];

  const away =
    CLUBS[$("awayClub").value];


  if (!home || !away) {
    return false;
  }


  state.homeClub =
    $("homeClub").value;

  state.awayClub =
    $("awayClub").value;


  state.homeName =
    $("homeName").value.trim() ||
    home.short;

  state.awayName =
    $("awayName").value.trim() ||
    away.short;


  state.homeLogo =
    home.logo;

  state.awayLogo =
    away.logo;


  state.homeColor =
    home.color;

  state.homeSecondary =
    home.secondary;


  state.awayColor =
    away.color;

  state.awaySecondary =
    away.secondary;


  state.competitionLogo =
    $("competition").value;


  state.homeScore =
    Math.max(
      0,
      Number($("homeScore").value) || 0
    );


  state.awayScore =
    Math.max(
      0,
      Number($("awayScore").value) || 0
    );

  return true;

}


/* ============================================================
   SEND
============================================================ */

function sendState() {

  if (
    !connection ||
    !connection.open
  ) {

    return;

  }


  connection.send({

    type: "state",

    state: {
      ...state
    }

  });


  console.log(
    "SENT TO OBS:",
    state
  );


  status(
    "✓ Scoreboard updated",
    true
  );

}


/* ============================================================
   BUILD + SEND
============================================================ */

function update() {

  if (!buildState()) {
    return;
  }

  sendState();

}


/* ============================================================
   UNIQUE ROOM + OBS LINK
============================================================ */

function makeRoomId() {

  const random =
    Math.random()
      .toString(36)
      .substring(2, 10);

  return "match-" + random;

}


function getOverlayUrl() {

  const url =
    new URL("index.html", window.location.href);

  url.searchParams.set(
    "room",
    $("room").value.trim()
  );

  return url.href;

}


function updateObsUrl() {

  const room =
    $("room").value.trim();

  $("obsUrl").value =
    room ? getOverlayUrl() : "";

}


function newRoom() {

  if (
    connection &&
    connection.open
  ) {
    try {
      connection.close();
    } catch (e) {}
  }

  if (peer) {
    try {
      peer.destroy();
    } catch (e) {}
  }

  connection = null;
  peer = null;
  connecting = false;

  $("room").value = makeRoomId();

  // Reset the match when creating a new OBS link.
  $("homeClub").value = "";
  $("awayClub").value = "";
  $("homeName").value = "";
  $("awayName").value = "";
  $("homeScore").value = 0;
  $("awayScore").value = 0;

  state = {
    ...state,
    homeName: "...",
    awayName: "...",
    homeClub: "",
    awayClub: "",
    homeLogo: "assets/clubs-and-countries/default.png",
    awayLogo: "assets/clubs-and-countries/default.png",
    homeColor: "#7a7a7a",
    homeSecondary: "#000000",
    awayColor: "#7a7a7a",
    awaySecondary: "#000000",
    homeScore: 0,
    awayScore: 0,
    elapsedMs: 0,
    running: false,
    startedAt: null
  };

  updateClubPreview("home");
  updateClubPreview("away");
  updateObsUrl();

  status(
    "New match link generated. Add the URL to OBS.",
    false
  );

}


async function copyObsUrl() {

  updateObsUrl();

  const url =
    $("obsUrl").value;

  if (!url) {
    return;
  }

  try {

    await navigator.clipboard.writeText(url);

    status(
      "✓ OBS URL copied",
      true
    );

  } catch (error) {

    $("obsUrl").select();
    document.execCommand("copy");

    status(
      "✓ OBS URL copied",
      true
    );

  }

}


/* ============================================================
   CONNECT
============================================================ */

function connect() {

  if (connecting) {
    return;
  }


  let room =
    $("room").value.trim();


  if (!room) {

    room = makeRoomId();

    $("room").value = room;

    updateObsUrl();

  }

  if (!buildState()) {

    status(
      "Choose both clubs before connecting.",
      false
    );

    return;

  }


  if (
    connection &&
    connection.open
  ) {

    sendState();

    return;

  }


  connecting = true;


  status(
    "Connecting to OBS...",
    false
  );


  if (peer) {

    try {
      peer.destroy();
    } catch (e) {}

    peer = null;

  }


  const controlId =
    "scoreboard-" +
    room +
    "-control-" +
    Math.random()
      .toString(36)
      .substring(2, 9);


  const displayId =
    "scoreboard-" +
    room +
    "-display";


  peer =
    new Peer(
      controlId,
      {
        debug: 2
      }
    );


  peer.on(
    "open",
    () => {

      console.log(
        "Control peer ready:",
        controlId
      );


      connection =
        peer.connect(
          displayId,
          {
            reliable: true
          }
        );


      connection.on(
        "open",
        () => {

          connecting = false;


          console.log(
            "CONNECTED TO OBS:",
            displayId
          );


          status(
            "✓ Connected to OBS",
            true
          );


          /*
           * Send the control panel's current
           * state immediately.
           */

          buildState();

          sendState();

        }
      );


      connection.on(
        "data",
        message => {

          console.log(
            "OBS MESSAGE:",
            message
          );


          /*
           * OBS can request the current state
           * after refreshing.
           */

          if (
            message &&
            message.type === "request-state"
          ) {

            buildState();

            sendState();

          }

        }
      );


      connection.on(
        "close",
        () => {

          connection = null;

          status(
            "Disconnected from OBS",
            false
          );

        }
      );


      connection.on(
        "error",
        error => {

          console.error(
            "Connection error:",
            error
          );

          status(
            "OBS connection error",
            false
          );

        }
      );

    }
  );


  peer.on(
    "error",
    error => {

      connecting = false;

      console.error(
        "PeerJS error:",
        error
      );


      if (
        error.type ===
        "peer-unavailable"
      ) {

        status(
          "OBS scoreboard not found. Open OBS scoreboard first.",
          false
        );

      } else {

        status(
          "PeerJS error: " +
          error.type,
          false
        );

      }

    }
  );

}


/* ============================================================
   CLUB PREVIEWS
============================================================ */

function updateClubPreview(side) {

  const club =
    CLUBS[
      side === "home"
        ? $("homeClub").value
        : $("awayClub").value
    ];


  if (!club) {
    return;
  }


  if (side === "home") {

    $("homePreview").src =
      club.logo;

    $("homePreviewName").textContent =
      $("homeName").value ||
      club.short;

    $("homeStyle").textContent =
      club.color +
      " / " +
      club.secondary;

  } else {

    $("awayPreview").src =
      club.logo;

    $("awayPreviewName").textContent =
      $("awayName").value ||
      club.short;

    $("awayStyle").textContent =
      club.color +
      " / " +
      club.secondary;

  }

}


/* ============================================================
   COMPETITION
============================================================ */

function updateCompetitionPreview() {

  $("competitionPreview").src =
    $("competition").value;

}


/* ============================================================
   SCORE
============================================================ */

function changeScore(side, amount) {

  const input =
    side === "home"
      ? $("homeScore")
      : $("awayScore");


  let value =
    Number(input.value) || 0;


  value += amount;


  if (value < 0) {
    value = 0;
  }


  input.value = value;


  update();

}


/* ============================================================
   CLOCK
============================================================ */

function getElapsed() {

  if (
    state.running &&
    state.startedAt !== null
  ) {

    return (
      state.elapsedMs +
      (
        Date.now() -
        state.startedAt
      )
    );

  }


  return state.elapsedMs;

}


function renderClock() {

  const seconds =
    Math.floor(
      Math.max(
        0,
        getElapsed()
      ) / 1000
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  $("clock").textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");

}


function startClock() {

  if (state.running) {
    return;
  }


  state.running = true;

  state.startedAt =
    Date.now();


  sendState();

}


function pauseClock() {

  if (!state.running) {
    return;
  }


  state.elapsedMs =
    getElapsed();


  state.running = false;

  state.startedAt = null;


  sendState();

}


function resetClock() {

  state.elapsedMs = 0;

  state.running = false;

  state.startedAt = null;


  sendState();

}


function setTime() {

  const value =
    prompt(
      "Enter match time in minutes:",
      "0"
    );


  if (value === null) {
    return;
  }


  const minutes =
    Math.max(
      0,
      Number(value) || 0
    );


  state.elapsedMs =
    minutes * 60 * 1000;


  state.running = false;

  state.startedAt = null;


  sendState();

}


/* ============================================================
   INPUT EVENTS
============================================================ */

$("room").addEventListener(
  "input",
  updateObsUrl
);


$("homeClub").addEventListener(
  "change",
  () => {

    const club =
      CLUBS[$("homeClub").value];


    $("homeName").value =
      club.short;


    updateClubPreview("home");

    update();

  }
);


$("awayClub").addEventListener(
  "change",
  () => {

    const club =
      CLUBS[$("awayClub").value];


    $("awayName").value =
      club.short;


    updateClubPreview("away");

    update();

  }
);


$("homeName").addEventListener(
  "input",
  () => {

    $("homePreviewName").textContent =
      $("homeName").value;


    update();

  }
);


$("awayName").addEventListener(
  "input",
  () => {

    $("awayPreviewName").textContent =
      $("awayName").value;


    update();

  }
);


$("homeScore").addEventListener(
  "input",
  update
);


$("awayScore").addEventListener(
  "input",
  update
);


$("competition").addEventListener(
  "change",
  () => {

    updateCompetitionPreview();

    update();

  }
);


/* ============================================================
   INITIAL
============================================================ */

if (!$("room").value.trim()) {
  $("room").value = makeRoomId();
}

updateObsUrl();

updateClubPreview("home");
updateClubPreview("away");
updateCompetitionPreview();
renderClock();


setInterval(
  renderClock,
  250
);

</script>

</html>
