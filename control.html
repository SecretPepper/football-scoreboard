<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Scoreboard Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0d0f12;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .card {
      width: 100%;
      background: #181b1f;
      border: 1px solid #2d3238;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 15px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 15px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #aaa;
    }

    input,
    select {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #101010;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #777;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    button:hover {
      background: #444;
    }

    .connect-button {
      width: 100%;
      background: #1677ff;
      padding: 15px;
      font-size: 17px;
    }

    .connect-button:hover {
      background: #3187ff;
    }

    .score-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .score-controls button {
      flex: 1;
    }

    .preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #101010;
    }

    .preview img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .preview-text {
      font-weight: bold;
    }

    .competition-preview {
      min-height: 70px;
      justify-content: center;
    }

    .competition-preview img {
      width: 100px;
      height: 55px;
    }

    .clock {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 10px 0 20px;
    }

    .clock-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #101010;
      color: #aaa;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .connected {
      color: #55d982;
    }

    .disconnected {
      color: #ff6b6b;
    }

    .club-style {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    .obs-link-wrap {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #101010;
    }

    .obs-link-row {
      display: flex;
      gap: 8px;
    }

    .obs-link-row input {
      flex: 1;
      min-width: 0;
      font-size: 13px;
    }

    .secondary-button {
      margin-top: 10px;
      width: 100%;
    }

    /* TEAM PICKER */

    .team-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .team-picker img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex: 0 0 36px;
    }

    .team-picker select {
      flex: 1;
      min-width: 0;
      width: auto;
    }

    .team-search-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .team-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 2000;
      display: none;
      max-height: 280px;
      overflow-y: auto;
      background: #101010;
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .team-suggestion {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: white;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      font-weight: normal;
    }

    .team-suggestion:hover {
      background: #252525;
    }

    .team-suggestion img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex: 0 0 36px;
    }

    .team-suggestion-info {
      min-width: 0;
      flex: 1;
    }

    .team-suggestion-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-suggestion-short {
      color: #888;
      font-size: 12px;
      margin-top: 2px;
    }

    /* PLAYER PICKER */

    .player-picker {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .player-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 50px;
      right: 0;
      z-index: 1000;
      display: none;
      max-height: 240px;
      overflow-y: auto;
      background: #101010;
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .player-suggestion {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: white;
      text-align: left;
      font-size: 14px;
      font-weight: normal;
    }

    .player-suggestion:hover,
    .player-suggestion.active {
      background: #252525;
    }

    .player-suggestion img {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
    }

    .player-suggestion-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-picker img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 50%;
      flex: 0 0 40px;
      background: #222;
    }

    .player-picker select {
      flex: 1;
      min-width: 0;
      width: auto;
    }

    .player-name {
      flex: 0 0 auto;
      min-width: 0;
      max-width: 130px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .goal-input-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .goal-input-row input {
      flex: 1;
      min-width: 0;
    }

    .goal-input-row button {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .scorers {
      margin-top: 15px;
    }

    .scorer-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #2d3238;
    }

    .scorer-row img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .scorer-info {
      flex: 1;
      min-width: 0;
    }

    .scorer-name {
      font-weight: bold;
    }

    .scorer-time {
      color: #aaa;
      font-size: 13px;
    }

    .remove-scorer {
      padding: 6px 9px;
      font-size: 12px;
      flex-shrink: 0;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .clock-buttons {
        grid-template-columns: 1fr 1fr;
      }

      .player-name {
        max-width: 100px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Football Scoreboard Control</h1>

  <div id="status" class="status disconnected">
    Not connected
  </div>

  <!-- CONNECTION -->

  <div class="card">

    <h2>Connection</h2>

    <div class="field">

      <label>Room name</label>

      <input
        id="room"
        value=""
        placeholder="Generated automatically"
      >

    </div>

    <button
      id="connectButton"
      class="connect-button"
      onclick="connect()"
    >
      CONNECT TO OBS
    </button>

    <div class="obs-link-wrap">

      <label>OBS Browser Source URL</label>

      <div class="obs-link-row">

        <input
          id="obsUrl"
          type="text"
          readonly
          placeholder="Generate a room first"
        >

        <button
          type="button"
          onclick="copyObsUrl()"
        >
          COPY
        </button>

      </div>

      <button
        type="button"
        class="secondary-button"
        onclick="newRoom()"
      >
        NEW OBS LINK / NEW MATCH
      </button>

    </div>

  </div>

  <!-- MATCH -->

  <div class="card">

    <h2>Match</h2>

    <div class="field">

      <label>Competition</label>

      <select id="competition">

        <option value="https://res.cloudinary.com/vbqf3fz4/image/upload/v1790692020/premier-league.png">
          Premier League
        </option>

        <option value="https://res.cloudinary.com/vbqf3fz4/image/upload/v1790692020/nations-league.png">
          Nations League
        </option>

      </select>

      <div class="preview competition-preview">

        <img
          id="competitionPreview"
          alt=""
        >

      </div>

    </div>

  </div>

  <!-- TEAMS -->

  <div class="grid">

    <!-- HOME -->

    <div class="card">

      <h2>Home Team</h2>

      <div class="field">

        <label>Club</label>

        <div class="team-picker">

          <img
            id="homeClubIcon"
            src="https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png"
            alt=""
          >

          <div class="team-search-wrap">

            <input
              id="homeClubSearch"
              type="text"
              placeholder="Search club..."
              autocomplete="off"
            >

            <div
              id="homeClubSuggestions"
              class="team-suggestions"
            ></div>

          </div>

          <select
            id="homeClub"
            style="display:none;"
          >
            <option value=""></option>
          </select>

        </div>

        <div id="homeStyle" class="club-style"></div>

      </div>

      <div class="field">

        <label>Country</label>

        <div class="team-picker">

          <img
            id="homeCountryIcon"
            src="https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png"
            alt=""
          >

          <div class="team-search-wrap">

            <input
              id="homeCountrySearch"
              type="text"
              placeholder="Search country..."
              autocomplete="off"
            >

            <div
              id="homeCountrySuggestions"
              class="team-suggestions"
            ></div>

          </div>

          <select
            id="homeCountry"
            style="display:none;"
          >
            <option value=""></option>
          </select>

        </div>

      </div>

      <div class="field">

        <label>Short name</label>

        <input
          id="homeName"
          value=""
          maxlength="5"
        >

      </div>

      <div class="field">

        <label>Score</label>

        <input
          id="homeScore"
          type="number"
          min="0"
          value="0"
        >

        <div class="score-controls">

          <button onclick="changeScore('home', -1)">−1</button>
          <button onclick="changeScore('home', 1)">+1</button>

        </div>

      </div>

      <div class="preview">

        <img
          id="homePreview"
          alt=""
        >

        <span
          id="homePreviewName"
          class="preview-text"
        >
          —
        </span>

      </div>

      <!-- HOME GOAL SCORER -->

      <div class="field">

        <label>Goal scorer</label>

        <div class="player-picker">

          <img
            id="homePlayerIcon"
            src="https://res.cloudinary.com/vbqf3fz4/image/upload/v1790598910/default.png"
            alt=""
          >

          <span
            id="homePlayerName"
            class="player-name"
          >
            Choose player...
          </span>

          <input
            id="homePlayer"
            type="text"
            placeholder="Search player..."
            autocomplete="off"
          >

        </div>

      </div>

      <div class="field">

        <label>Goal time</label>

        <div class="goal-input-row">

          <input
            id="homeGoalTime"
            type="number"
            min="0"
            placeholder="Time"
          >

          <button onclick="addScorer('home')">
            ADD GOAL
          </button>

        </div>

      </div>

      <div
        id="homeScorers"
        class="scorers"
      ></div>

    </div>

    <!-- AWAY -->

    <div class="card">

      <h2>Away Team</h2>

      <div class="field">

        <label>Club</label>

        <div class="team-picker">

          <img
            id="awayClubIcon"
            src="https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png"
            alt=""
          >

          <div class="team-search-wrap">

            <input
              id="awayClubSearch"
              type="text"
              placeholder="Search club..."
              autocomplete="off"
            >

            <div
              id="awayClubSuggestions"
              class="team-suggestions"
            ></div>

          </div>

          <select
            id="awayClub"
            style="display:none;"
          >
            <option value=""></option>
          </select>

        </div>

        <div id="awayStyle" class="club-style"></div>

      </div>

      <div class="field">

        <label>Country</label>

        <div class="team-picker">

          <img
            id="awayCountryIcon"
            src="https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png"
            alt=""
          >

          <div class="team-search-wrap">

            <input
              id="awayCountrySearch"
              type="text"
              placeholder="Search country..."
              autocomplete="off"
            >

            <div
              id="awayCountrySuggestions"
              class="team-suggestions"
            ></div>

          </div>

          <select
            id="awayCountry"
            style="display:none;"
          >
            <option value=""></option>
          </select>

        </div>

      </div>

      <div class="field">

        <label>Short name</label>

        <input
          id="awayName"
          value=""
          maxlength="5"
        >

      </div>

      <div class="field">

        <label>Score</label>

        <input
          id="awayScore"
          type="number"
          min="0"
          value="0"
        >

        <div class="score-controls">

          <button onclick="changeScore('away', -1)">−1</button>
          <button onclick="changeScore('away', 1)">+1</button>

        </div>

      </div>

      <div class="preview">

        <img
          id="awayPreview"
          alt=""
        >

        <span
          id="awayPreviewName"
          class="preview-text"
        >
          —
        </span>

      </div>

      <!-- AWAY GOAL SCORER -->

      <div class="field">

        <label>Goal scorer</label>

        <div class="player-picker">

          <img
            id="awayPlayerIcon"
            src="https://res.cloudinary.com/vbqf3fz4/image/upload/v1790598910/default.png"
            alt=""
          >

          <span
            id="awayPlayerName"
            class="player-name"
          >
            Choose player...
          </span>

          <input
            id="awayPlayer"
            type="text"
            placeholder="Search player..."
            autocomplete="off"
          >

        </div>

      </div>

      <div class="field">

        <label>Goal time</label>

        <div class="goal-input-row">

          <input
            id="awayGoalTime"
            type="number"
            min="0"
            placeholder="Time"
          >

          <button onclick="addScorer('away')">
            ADD GOAL
          </button>

        </div>

      </div>

      <div
        id="awayScorers"
        class="scorers"
      ></div>

    </div>

  </div>

  <!-- CLOCK -->

  <div class="card">

    <h2>Match Clock</h2>

    <div
      id="clock"
      class="clock"
    >
      00:00
    </div>

    <div class="clock-buttons">

      <button onclick="startClock()">START</button>
      <button onclick="pauseClock()">PAUSE</button>
      <button onclick="resetClock()">RESET</button>
      <button onclick="setTime()">SET TIME</button>

    </div>

  </div>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="info.js"></script>

<script>

let state = {

  homeName: "...",
  awayName: "...",

  homeClub: "",
  awayClub: "",

  homeLogo:
    "https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png",

  awayLogo:
    "https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png",

  homeColor: "#7a7a7a",
  homeSecondary: "#000000",

  awayColor: "#7a7a7a",
  awaySecondary: "#000000",

  competitionLogo:
    "https://res.cloudinary.com/vbqf3fz4/image/upload/v1790692020/premier-league.png",

  homeScore: 0,
  awayScore: 0,

  homeScorers: [],
  awayScorers: [],

  elapsedMs: 0,
  running: false,
  startedAt: null

};

let peer = null;
let connection = null;
let connecting = false;

const $ = id =>
  document.getElementById(id);

function status(text, connected = false) {

  const el = $("status");

  el.textContent = text;

  el.className =
    connected
      ? "status connected"
      : "status disconnected";

}

function getSelectedTeam(side) {

  const clubSelect =
    side === "home"
      ? $("homeClub")
      : $("awayClub");

  const countrySelect =
    side === "home"
      ? $("homeCountry")
      : $("awayCountry");

  if (clubSelect.value) {

    return {
      id: clubSelect.value,
      team: CLUBS[clubSelect.value],
      type: "club"
    };

  }

  if (countrySelect.value) {

    return {
      id: countrySelect.value,
      team: COUNTRIES[countrySelect.value],
      type: "country"
    };

  }

  return null;

}

function buildState() {

  const homeSelected =
    getSelectedTeam("home");

  const awaySelected =
    getSelectedTeam("away");

  if (
    !homeSelected ||
    !awaySelected
  ) {

    return false;

  }

  state.homeClub =
    homeSelected.id;

  state.awayClub =
    awaySelected.id;

  /*
    Keep the Short name fields as the short codes.
    Example:
    Manchester United -> MUN
    Germany -> GER
  */

  state.homeName =
    $("homeName").value.trim() ||
    homeSelected.team.short ||
    "";

  state.awayName =
    $("awayName").value.trim() ||
    awaySelected.team.short ||
    "";

  state.homeLogo =
    homeSelected.team.logo;

  state.awayLogo =
    awaySelected.team.logo;

  state.homeColor =
    homeSelected.team.color ||
    "#7a7a7a";

  state.homeSecondary =
    homeSelected.team.secondary ||
    "#000000";

  state.awayColor =
    awaySelected.team.color ||
    "#7a7a7a";

  state.awaySecondary =
    awaySelected.team.secondary ||
    "#000000";

  state.competitionLogo =
    $("competition").value;

  state.homeScore =
    Math.max(
      0,
      Number($("homeScore").value) || 0
    );

  state.awayScore =
    Math.max(
      0,
      Number($("awayScore").value) || 0
    );

  return true;

}

function sendState() {

  if (
    !connection ||
    !connection.open
  ) {

    return;

  }

  connection.send({

    type: "state",

    state: {
      ...state
    }

  });

  console.log(
    "SENT TO OBS:",
    state
  );

  status(
    "✓ Scoreboard updated",
    true
  );

}

function update() {

  if (!buildState()) {
    return;
  }

  sendState();

}

function makeRoomId() {

  const random =
    Math.random()
      .toString(36)
      .substring(2, 10);

  return "match-" + random;

}

function getOverlayUrl() {

  const url =
    new URL(
      "index.html",
      window.location.href
    );

  url.searchParams.set(
    "room",
    $("room").value.trim()
  );

  return url.href;

}

function updateObsUrl() {

  const room =
    $("room").value.trim();

  $("obsUrl").value =
    room ? getOverlayUrl() : "";

}

function newRoom() {

  if (
    connection &&
    connection.open
  ) {

    try {
      connection.close();
    } catch (e) {}

  }

  if (peer) {

    try {
      peer.destroy();
    } catch (e) {}

  }

  connection = null;
  peer = null;
  connecting = false;

  $("room").value =
    makeRoomId();

  $("homeClub").value = "";
  $("homeCountry").value = "";

  $("awayClub").value = "";
  $("awayCountry").value = "";

  $("homeClubSearch").value = "";
  $("homeCountrySearch").value = "";

  $("awayClubSearch").value = "";
  $("awayCountrySearch").value = "";

  $("homeName").value = "";
  $("awayName").value = "";

  $("homeScore").value = 0;
  $("awayScore").value = 0;

  $("homeGoalTime").value = "";
  $("awayGoalTime").value = "";

  state = {

    ...state,

    homeName: "...",
    awayName: "...",

    homeClub: "",
    awayClub: "",

    homeLogo:
      "https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png",

    awayLogo:
      "https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png",

    homeColor: "#7a7a7a",
    homeSecondary: "#000000",

    awayColor: "#7a7a7a",
    awaySecondary: "#000000",

    homeScore: 0,
    awayScore: 0,

    homeScorers: [],
    awayScorers: [],

    elapsedMs: 0,
    running: false,
    startedAt: null

  };

  updateTeamPreview("home");
  updateTeamPreview("away");

  updatePlayerList("home");
  updatePlayerList("away");

  renderScorers("home");
  renderScorers("away");

  updateObsUrl();

  status(
    "New match link generated. Add the URL to OBS.",
    false
  );

}

async function copyObsUrl() {

  updateObsUrl();

  const url =
    $("obsUrl").value;

  if (!url) {
    return;
  }

  try {

    await navigator.clipboard.writeText(url);

    status(
      "✓ OBS URL copied",
      true
    );

  } catch (error) {

    $("obsUrl").select();

    document.execCommand("copy");

    status(
      "✓ OBS URL copied",
      true
    );

  }

}

function connect() {

  if (connecting) {
    return;
  }

  let room =
    $("room").value.trim();

  if (!room) {

    room =
      makeRoomId();

    $("room").value =
      room;

    updateObsUrl();

  }

  if (!buildState()) {

    status(
      "Choose both teams before connecting.",
      false
    );

    return;

  }

  if (
    connection &&
    connection.open
  ) {

    sendState();

    return;

  }

  connecting = true;

  status(
    "Connecting to OBS...",
    false
  );

  if (peer) {

    try {
      peer.destroy();
    } catch (e) {}

    peer = null;

  }

  const controlId =
    "scoreboard-" +
    room +
    "-control-" +
    Math.random()
      .toString(36)
      .substring(2, 9);

  const displayId =
    "scoreboard-" +
    room +
    "-display";

  peer =
    new Peer(
      controlId,
      {
        debug: 2
      }
    );

  peer.on(
    "open",
    () => {

      console.log(
        "Control peer ready:",
        controlId
      );

      connection =
        peer.connect(
          displayId,
          {
            reliable: true
          }
        );

      connection.on(
        "open",
        () => {

          connecting = false;

          console.log(
            "CONNECTED TO OBS:",
            displayId
          );

          status(
            "✓ Connected to OBS",
            true
          );

          buildState();

          sendState();

        }
      );

      connection.on(
        "data",
        message => {

          console.log(
            "OBS MESSAGE:",
            message
          );

          if (
            message &&
            message.type === "request-state"
          ) {

            buildState();

            sendState();

          }

        }
      );

      connection.on(
        "close",
        () => {

          connection = null;

          status(
            "Disconnected from OBS",
            false
          );

        }
      );

      connection.on(
        "error",
        error => {

          console.error(
            "Connection error:",
            error
          );

          status(
            "OBS connection error",
            false
          );

        }
      );

    }
  );

  peer.on(
    "error",
    error => {

      connecting = false;

      console.error(
        "PeerJS error:",
        error
      );

      if (
        error.type ===
        "peer-unavailable"
      ) {

        status(
          "OBS scoreboard not found. Open OBS scoreboard first.",
          false
        );

      } else {

        status(
          "PeerJS error: " +
          error.type,
          false
        );

      }

    }
  );

}

function getAllPlayers() {
  return PLAYERS;
}

function getPlayerSuggestions(side) {

  const input =
    side === "home"
      ? $("homePlayer")
      : $("awayPlayer");

  const suggestions =
    side === "home"
      ? $("homePlayerSuggestions")
      : $("awayPlayerSuggestions");

  if (!input || !suggestions) {
    return;
  }

  const query =
    normalizePlayerName(
      input.value.trim()
    );

  if (!query) {

    suggestions.innerHTML = "";

    suggestions.style.display =
      "none";

    return;

  }

  const players =
    getAllPlayers()
      .map(
        (player, index) => {

          const name =
            normalizePlayerName(
              player.name
            );

          let score = 0;

          if (name === query) {
            score = 1000;
          } else if (
            name.startsWith(query)
          ) {
            score = 500;
          } else if (
            name.includes(query)
          ) {
            score = 250;
          } else {
            return null;
          }

          return {
            player,
            index,
            score
          };

        }
      )
      .filter(Boolean)
      .sort(
        (a, b) =>
          b.score - a.score ||
          a.index - b.index
      )
      .slice(0, 6);

  if (!players.length) {

    suggestions.innerHTML = "";

    suggestions.style.display =
      "none";

    return;

  }

  suggestions.innerHTML = "";

  players.forEach(
    ({ player }) => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "player-suggestion";

      const image =
        document.createElement("img");

      image.src =
        player.profile;

      image.alt = "";

      const name =
        document.createElement("span");

      name.className =
        "player-suggestion-name";

      name.textContent =
        player.name;

      button.appendChild(image);
      button.appendChild(name);

      button.addEventListener(
        "mousedown",
        event => {

          event.preventDefault();

          selectPlayer(
            side,
            player
          );

        }
      );

      suggestions.appendChild(
        button
      );

    }
  );

  suggestions.style.display =
    "block";

}

function normalizePlayerName(name) {

  return String(name)
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .replace(
      /[^a-z0-9]/g,
      ""
    );

}

function updatePlayerPreview(side) {

  const input =
    side === "home"
      ? $("homePlayer")
      : $("awayPlayer");

  const image =
    side === "home"
      ? $("homePlayerIcon")
      : $("awayPlayerIcon");

  const name =
    side === "home"
      ? $("homePlayerName")
      : $("awayPlayerName");

  const value =
    normalizePlayerName(
      input.value

  const player =

    );

function addScorer(side) {

  const playerInput =
    side === "home"
      ? $("homePlayer")
      : $("awayPlayer");

  const timeInput =
    side === "home"
      ? $("homeGoalTime")
      : $("awayGoalTime");

  const player =
    getAllPlayers().find(
      item =>
        item.id ===
        playerInput.dataset.playerId
    );

  const time =
    Number(timeInput.value);

  if (!player) {

    status(
      "Choose a player first.",
      false
    );

    return;

  }

  if (
    !Number.isFinite(time) ||
    time < 0
  ) {

    status(
      "Enter the goal time.",
      false
    );

    return;

  }

  const scorer = {

    playerId:
      player.id,

    name:
      player.name,

    profile:
      player.profile,

    time:
      Math.floor(time)

  };

  if (side === "home") {

    state.homeScorers.push(
      scorer
    );

  } else {

    state.awayScorers.push(
      scorer
    );

  }

  timeInput.value = "";

  renderScorers(side);

  update();

}

function removeScorer(side, index) {

  if (side === "home") {

    state.homeScorers.splice(
      index,
      1
    );

  } else {

    state.awayScorers.splice(
      index,
      1
    );

  }

  renderScorers(side);

  update();

}

function renderScorers(side) {

  const container =
    side === "home"
      ? $("homeScorers")
      : $("awayScorers");

  const scorers =
    side === "home"
      ? state.homeScorers
      : state.awayScorers;

  scorers.sort(
    (a, b) =>
      Number(a.time) -
      Number(b.time)
  );

  container.innerHTML = "";

  scorers.forEach(
    (scorer, index) => {

      const row =
        document.createElement("div");

      row.className =
        "scorer-row";

      const image =
        document.createElement("img");

      image.src =
        scorer.profile;

      image.alt = "";

      const info =
        document.createElement("div");

      info.className =
        "scorer-info";

      const name =
        document.createElement("div");

      name.className =
        "scorer-name";

      name.textContent =
        scorer.name;

      const time =
        document.createElement("div");

      time.className =
        "scorer-time";

      time.textContent =
        scorer.time + "'";

      info.appendChild(name);
      info.appendChild(time);

      const remove =
        document.createElement("button");

      remove.className =
        "remove-scorer";

      remove.textContent =
        "REMOVE";

      remove.onclick =
        () =>
          removeScorer(
            side,
            index
          );

      row.appendChild(image);
      row.appendChild(info);
      row.appendChild(remove);

      container.appendChild(row);

    }
  );

}

function getElapsed() {

  if (
    state.running &&
    state.startedAt !== null
  ) {

    return (
      state.elapsedMs +
      (
        Date.now() -
        state.startedAt
      )
    );

  }

  return state.elapsedMs;

}

function renderClock() {

  const seconds =
    Math.floor(
      Math.max(
        0,
        getElapsed()
      ) / 1000
    );

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;

  $("clock").textContent =
    String(minutes).padStart(
      2,
      "0"
    ) +
    ":" +
    String(secs).padStart(
      2,
      "0"
    );

}

function startClock() {

  if (state.running) {
    return;
  }

  state.running = true;

  state.startedAt =
    Date.now();

  sendState();

}

function pauseClock() {

  if (!state.running) {
    return;
  }

  state.elapsedMs =
    getElapsed();

  state.running = false;

  state.startedAt = null;

  sendState();

}

function resetClock() {

  state.elapsedMs = 0;

  state.running = false;

  state.startedAt = null;

  sendState();

}

function setTime() {

  const value =
    prompt(
      "Enter match time in minutes:",
      "0"
    );

  if (value === null) {
    return;
  }

  const minutes =
    Math.max(
      0,
      Number(value) || 0
    );

  state.elapsedMs =
    minutes * 60 * 1000;

  state.running = false;

  state.startedAt = null;

  sendState();

}

/*
  TEAM CHANGE

  Clubs and countries both use:
  info.js -> name
  info.js -> short

  The search field shows the full name.

  The separate "Short name" field gets
  the short code.

  Example:

  Search:
  Manchester United
  MUN

  Short name field:
  MUN
*/

function handleTeamChange(side, type) {

  const clubSelect =
    side === "home"
      ? $("homeClub")
      : $("awayClub");

  const countrySelect =
    side === "home"
      ? $("homeCountry")
      : $("awayCountry");

  if (type === "club") {

    if (clubSelect.value) {
      countrySelect.value = "";
    }

  } else {

    if (countrySelect.value) {
      clubSelect.value = "";
    }

  }

  const selected =
    getSelectedTeam(side);

  const nameInput =
    side === "home"
      ? $("homeName")
      : $("awayName");

  if (selected) {

    /*
      The Short name input should stay
      the short code from info.js.

      Example:
      Manchester United -> MUN
      Barcelona -> BAR
      Germany -> GER
    */

    nameInput.value =
      selected.team.short ||
      "";

  } else {

    nameInput.value =
      "";

  }

  if (side === "home") {

    state.homeScorers = [];

  } else {

    state.awayScorers = [];

  }

  updateTeamPreview(side);

  updatePlayerList(side);

  renderScorers(side);

  update();

}

/*
  Gets the full display name from info.js.

  Clubs:
  item.name

  Countries:
  item.name

  There is also a fallback that converts
  IDs such as "manchester-united" into
  "Manchester United" if a name is missing.
*/

function teamDisplayName(
  id,
  item,
  type
) {

  if (item && item.name) {

    return item.name;

  }

  return String(id)
    .split("-")
    .map(
      word =>
        word.charAt(0).toUpperCase() +
        word.slice(1)
    )
    .join(" ");

}

function setupTeamSearch(
  side,
  type
) {

  const prefix =
    side === "home"
      ? "home"
      : "away";

  const typeName =
    type === "club"
      ? "Club"
      : "Country";

  const input =
    $(
      prefix +
      typeName +
      "Search"
    );

  const suggestions =
    $(
      prefix +
      typeName +
      "Suggestions"
    );

  const select =
    $(
      prefix +
      typeName
    );

  const data =
    type === "club"
      ? CLUBS
      : COUNTRIES;

  if (
    !input ||
    !suggestions ||
    !select
  ) {
    return;
  }


  /*
    IMPORTANT:
    Populate the hidden select with all
    clubs/countries from info.js.

    Without these options,
    select.value = id does nothing.
  */

  select.innerHTML =
    '<option value=""></option>';

  Object.entries(data).forEach(
    ([id, item]) => {

      const option =
        document.createElement("option");

      option.value =
        id;

      option.textContent =
        item.name ||
        item.short ||
        id;

      select.appendChild(
        option
      );

    }
  );


  function render() {

    const query =
      input.value
        .trim()
        .toLowerCase();


    if (!query) {

      suggestions.innerHTML =
        "";

      suggestions.style.display =
        "none";

      return;

    }


    const results =
      Object.entries(data)
        .map(
          ([id, item]) => {

            const name =
              teamDisplayName(
                id,
                item,
                type
              );

            const short =
              item.short || "";


            const haystack =
              (
                name +
                " " +
                short +
                " " +
                id
              ).toLowerCase();


            if (
              !haystack.includes(query)
            ) {

              return null;

            }


            let score = 100;


            if (
              name.toLowerCase() ===
              query
            ) {

              score = 1000;

            } else if (
              name.toLowerCase()
                .startsWith(query)
            ) {

              score = 500;

            } else if (
              short.toLowerCase()
                .startsWith(query)
            ) {

              score = 400;

            } else if (
              id.toLowerCase()
                .startsWith(query)
            ) {

              score = 300;

            }


            return {
              id,
              item,
              name,
              short,
              score
            };

          }
        )
        .filter(Boolean)
        .sort(
          (a, b) =>
            b.score - a.score ||
            a.name.localeCompare(
              b.name
            )
        )
        .slice(0, 10);


    suggestions.innerHTML =
      "";


    if (!results.length) {

      suggestions.innerHTML =
        '<div style="padding:12px;color:#888;">No results found</div>';

      suggestions.style.display =
        "block";

      return;

    }


    results.forEach(
      result => {

        const button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "team-suggestion";


        const image =
          document.createElement(
            "img"
          );

        image.src =
          result.item.logo ||
          "https://res.cloudinary.com/vbqf3fz4/image/upload/v1790691349/clubflagicon.png";

        image.alt =
          "";


        const info =
          document.createElement(
            "div"
          );

        info.className =
          "team-suggestion-info";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "team-suggestion-name";

        name.textContent =
          result.name;

        info.appendChild(
          name
        );


        if (
          result.short &&
          result.short !== result.name
        ) {

          const short =
            document.createElement(
              "div"
            );

          short.className =
            "team-suggestion-short";

          short.textContent =
            result.short;

          info.appendChild(
            short
          );

        }


        button.appendChild(
          image
        );

        button.appendChild(
          info
        );


        button.addEventListener(
          "mousedown",
          event => {

            event.preventDefault();

            selectTeam(
              side,
              type,
              result.id,
              result.name
            );

          }
        );


        suggestions.appendChild(
          button
        );

      }
    );


    suggestions.style.display =
      "block";

  }


  input.addEventListener(
    "input",
    render
  );


  input.addEventListener(
    "focus",
    render
  );


  input.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      const first =
        suggestions.querySelector(
          ".team-suggestion"
        );

      if (first) {

        first.dispatchEvent(
          new MouseEvent(
            "mousedown",
            {
              bubbles: true,
              cancelable: true
            }
          )
        );

      }

      return;
    }


    if (event.key === "Escape") {

      suggestions.style.display =
        "none";

    }

  }
);

}

function selectTeam(
  side,
  type,
  id,
  displayName
) {

  const prefix =
    side === "home"
      ? "home"
      : "away";

  const typeName =
    type === "club"
      ? "Club"
      : "Country";

  const input =
    $(
      prefix +

    );

  const select =

    );

  const suggestions =
    $(

  handleTeamChange(

  );

}

  () => {

    updatePlayerPreview("away");

    getPlayerSuggestions("away");

  }
);

$("awayPlayer").addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      const suggestions =
        $("awayPlayerSuggestions");

      if (
        suggestions &&
        suggestions.style.display !==
          "none"
      ) {

        const first =
          suggestions.querySelector(
            ".player-suggestion"
          );

        if (first) {

          event.preventDefault();

          first.dispatchEvent(
            new MouseEvent(
              "mousedown",
              {
                bubbles: true,
                cancelable: true
              }
            )
          );

        }

      }

    } else if (
      event.key === "Escape"
    ) {

      hidePlayerSuggestions(
        "away"
      );

    }

  }
);

/*
  CLOSE SEARCH DROPDOWNS
*/

document.addEventListener(
  "click",
  event => {

    if (
      !event.target.closest(
        ".player-picker"
      ) &&
      !event.target.closest(
        ".team-search-wrap"
      )
    ) {

      hidePlayerSuggestions(
        "home"
      );

      hidePlayerSuggestions(
        "away"
      );

      [
        "homeClub",
        "homeCountry",
        "awayClub",
        "awayCountry"
      ].forEach(
        id => {

          const prefix =
            id
              .replace(
                /Club|Country$/,
                ""
              );

          const type =
            id.includes("Club")
              ? "Club"
              : "Country";

          const el =
            $(
              prefix +
              type +
              "Suggestions"
            );

          if (el) {

            el.style.display =
              "none";

          }

        }
      );

    }

  }
);

/*
  COMPETITION
*/

$("competition").addEventListener(
  "change",
  () => {

    updateCompetitionPreview();

    update();

  }
);

/*
  ROOM INITIALIZATION
*/

if (!$("room").value.trim()) {

  $("room").value =
    makeRoomId();

}

/*
  PLAYER SUGGESTION LISTS
*/

function createPlayerSuggestionLists() {

  [
    "home",
    "away"
  ].forEach(
    side => {

      const input =
        side === "home"
          ? $("homePlayer")
          : $("awayPlayer");

      const suggestions =
        document.createElement(
          "div"
        );

      suggestions.id =
        side +
        "PlayerSuggestions";

      suggestions.className =
        "player-suggestions";

      input.parentElement.appendChild(
        suggestions
      );

    }
  );

}

createPlayerSuggestionLists();

/*
  INITIALIZE
*/

updateObsUrl();

updateTeamPreview("home");
updateTeamPreview("away");

updatePlayerList("home");
updatePlayerList("away");

renderScorers("home");
renderScorers("away");

updateCompetitionPreview();

renderClock();

setInterval(
  renderClock,
  250
);

</script>

</body>
</html>
