<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 15px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #aaa;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #101010;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #777;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    button:hover {
      background: #444;
    }

    .primary {
      width: 100%;
      background: #168a45;
      padding: 15px;
      font-size: 17px;
    }

    .primary:hover {
      background: #1da653;
    }

    .danger {
      background: #8d2525;
    }

    .score-controls {
      display: flex;
      gap: 8px;
    }

    .score-controls button {
      flex: 1;
    }

    .preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #101010;
    }

    .preview img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .preview-text {
      font-weight: bold;
    }

    .competition-preview {
      min-height: 70px;
      justify-content: center;
    }

    .competition-preview img {
      width: 100px;
      height: 55px;
    }

    .clock {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 10px 0 20px;
    }

    .clock-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #101010;
      color: #aaa;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .connected {
      color: #55d982;
    }

    .disconnected {
      color: #ff6b6b;
    }

    .club-style {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .clock-buttons {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Football Scoreboard Control</h1>

  <div id="status" class="status disconnected">
    Not connected
  </div>

  <!-- CONNECTION -->
  <div class="card">
    <h2>Connection</h2>

    <div class="field">
      <label>Room name</label>
      <input id="room" value="premier-league-match">
    </div>

    <button id="connectButton" onclick="connect()">
      CONNECT TO OBS
    </button>
  </div>


  <!-- MATCH -->
  <div class="card">
    <h2>Match</h2>

    <div class="field">
      <label>Competition</label>

      <select id="competition">
        <option value="assets/competitions/premier-league.png">
          Premier League
        </option>

        <option value="assets/competitions/champions-league.png">
          Champions League
        </option>

        <option value="assets/competitions/europa-league.png">
          Europa League
        </option>

        <option value="assets/competitions/conference-league.png">
          Conference League
        </option>

        <option value="assets/competitions/fa-cup.png">
          FA Cup
        </option>

        <option value="assets/competitions/efl-cup.png">
          EFL Cup
        </option>

        <option value="assets/competitions/world-cup.png">
          World Cup
        </option>

        <option value="assets/competitions/euro.png">
          UEFA Euro
        </option>
      </select>

      <div class="preview competition-preview">
        <img id="competitionPreview">
      </div>
    </div>
  </div>


  <!-- TEAMS -->
  <div class="grid">

    <!-- HOME -->
    <div class="card">
      <h2>Home Team</h2>

      <div class="field">
        <label>Club</label>

        <select id="homeClub">
          <option value="fulham">Fulham</option>
          <option value="manchester-united">Manchester United</option>
          <option value="arsenal">Arsenal</option>
          <option value="chelsea">Chelsea</option>
          <option value="liverpool">Liverpool</option>
          <option value="manchester-city">Manchester City</option>
          <option value="tottenham">Tottenham Hotspur</option>
          <option value="newcastle">Newcastle United</option>
          <option value="brighton">Brighton</option>
          <option value="aston-villa">Aston Villa</option>
          <option value="west-ham">West Ham United</option>
          <option value="crystal-palace">Crystal Palace</option>
          <option value="everton">Everton</option>
          <option value="wolves">Wolverhampton Wanderers</option>
          <option value="nottingham-forest">Nottingham Forest</option>
          <option value="brentford">Brentford</option>
          <option value="bournemouth">Bournemouth</option>
          <option value="leicester">Leicester City</option>
          <option value="leeds">Leeds United</option>
          <option value="sunderland">Sunderland</option>
        </select>

        <div id="homeStyle" class="club-style"></div>
      </div>

      <div class="field">
        <label>Short name</label>
        <input id="homeName" value="FUL" maxlength="5">
      </div>

      <div class="field">
        <label>Score</label>
        <input id="homeScore" type="number" min="0" value="0">

        <div class="score-controls">
          <button onclick="changeScore('home', -1)">−1</button>
          <button onclick="changeScore('home', 1)">+1</button>
        </div>
      </div>

      <div class="preview">
        <img id="homePreview">
        <span id="homePreviewName" class="preview-text">FUL</span>
      </div>
    </div>


    <!-- AWAY -->
    <div class="card">
      <h2>Away Team</h2>

      <div class="field">
        <label>Club</label>

        <select id="awayClub">
          <option value="fulham">Fulham</option>
          <option value="manchester-united">Manchester United</option>
          <option value="arsenal">Arsenal</option>
          <option value="chelsea">Chelsea</option>
          <option value="liverpool">Liverpool</option>
          <option value="manchester-city">Manchester City</option>
          <option value="tottenham">Tottenham Hotspur</option>
          <option value="newcastle">Newcastle United</option>
          <option value="brighton">Brighton</option>
          <option value="aston-villa">Aston Villa</option>
          <option value="west-ham">West Ham United</option>
          <option value="crystal-palace">Crystal Palace</option>
          <option value="everton">Everton</option>
          <option value="wolves">Wolverhampton Wanderers</option>
          <option value="nottingham-forest">Nottingham Forest</option>
          <option value="brentford">Brentford</option>
          <option value="bournemouth">Bournemouth</option>
          <option value="leicester">Leicester City</option>
          <option value="leeds">Leeds United</option>
          <option value="sunderland">Sunderland</option>
        </select>

        <div id="awayStyle" class="club-style"></div>
      </div>

      <div class="field">
        <label>Short name</label>
        <input id="awayName" value="MUN" maxlength="5">
      </div>

      <div class="field">
        <label>Score</label>
        <input id="awayScore" type="number" min="0" value="0">

        <div class="score-controls">
          <button onclick="changeScore('away', -1)">−1</button>
          <button onclick="changeScore('away', 1)">+1</button>
        </div>
      </div>

      <div class="preview">
        <img id="awayPreview">
        <span id="awayPreviewName" class="preview-text">MUN</span>
      </div>
    </div>

  </div>


  <!-- CLOCK -->
  <div class="card">
    <h2>Match Clock</h2>

    <div id="clock" class="clock">
      00:00
    </div>

    <div class="clock-buttons">
      <button onclick="startClock()">START</button>
      <button onclick="pauseClock()">PAUSE</button>
      <button onclick="resetClock()">RESET</button>
      <button onclick="setTime()">SET TIME</button>
    </div>
  </div>


  <button class="primary" onclick="applyChanges()">
    APPLY CHANGES TO OBS
  </button>

</div>


<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>

  /* ============================================================
     CLUB DATABASE
     ============================================================ */

  const CLUBS = {

    fulham: {
      name: "Fulham",
      short: "FUL",
      logo: "assets/clubs-and-countries/fulham.png",
      color: "#000000",
      secondary: "#ffffff"
    },

    "manchester-united": {
      name: "Manchester United",
      short: "MUN",
      logo: "assets/clubs-and-countries/manchester-united.png",
      color: "#da291c",
      secondary: "#000000"
    },

    arsenal: {
      name: "Arsenal",
      short: "ARS",
      logo: "assets/clubs-and-countries/arsenal.png",
      color: "#db0007",
      secondary: "#ffffff"
    },

    chelsea: {
      name: "Chelsea",
      short: "CHE",
      logo: "assets/clubs-and-countries/chelsea.png",
      color: "#034694",
      secondary: "#ffffff"
    },

    liverpool: {
      name: "Liverpool",
      short: "LIV",
      logo: "assets/clubs-and-countries/liverpool.png",
      color: "#c8102e",
      secondary: "#ffffff"
    },

    "manchester-city": {
      name: "Manchester City",
      short: "MCI",
      logo: "assets/clubs-and-countries/manchester-city.png",
      color: "#6cabdd",
      secondary: "#ffffff"
    },

    tottenham: {
      name: "Tottenham Hotspur",
      short: "TOT",
      logo: "assets/clubs-and-countries/tottenham.png",
      color: "#132257",
      secondary: "#ffffff"
    },

    newcastle: {
      name: "Newcastle United",
      short: "NEW",
      logo: "assets/clubs-and-countries/newcastle.png",
      color: "#241f20",
      secondary: "#ffffff"
    },

    brighton: {
      name: "Brighton",
      short: "BHA",
      logo: "assets/clubs-and-countries/brighton.png",
      color: "#0057b8",
      secondary: "#ffffff"
    },

    "aston-villa": {
      name: "Aston Villa",
      short: "AVL",
      logo: "assets/clubs-and-countries/aston-villa.png",
      color: "#670e36",
      secondary: "#ffffff"
    },

    "west-ham": {
      name: "West Ham United",
      short: "WHU",
      logo: "assets/clubs-and-countries/west-ham.png",
      color: "#7a263a",
      secondary: "#1bb1e7"
    },

    "crystal-palace": {
      name: "Crystal Palace",
      short: "CRY",
      logo: "assets/clubs-and-countries/crystal-palace.png",
      color: "#1b458f",
      secondary: "#c4122e"
    },

    everton: {
      name: "Everton",
      short: "EVE",
      logo: "assets/clubs-and-countries/everton.png",
      color: "#003399",
      secondary: "#ffffff"
    },

    wolves: {
      name: "Wolverhampton Wanderers",
      short: "WOL",
      logo: "assets/clubs-and-countries/wolves.png",
      color: "#fdb913",
      secondary: "#000000"
    },

    "nottingham-forest": {
      name: "Nottingham Forest",
      short: "NFO",
      logo: "assets/clubs-and-countries/nottingham-forest.png",
      color: "#e53233",
      secondary: "#ffffff"
    },

    brentford: {
      name: "Brentford",
      short: "BRE",
      logo: "assets/clubs-and-countries/brentford.png",
      color: "#e30613",
      secondary: "#ffffff"
    },

    bournemouth: {
      name: "Bournemouth",
      short: "BOU",
      logo: "assets/clubs-and-countries/bournemouth.png",
      color: "#da291c",
      secondary: "#000000"
    },

    leicester: {
      name: "Leicester City",
      short: "LEI",
      logo: "assets/clubs-and-countries/leicester.png",
      color: "#003090",
      secondary: "#f5f5f5"
    },

    leeds: {
      name: "Leeds United",
      short: "LEE",
      logo: "assets/clubs-and-countries/leeds.png",
      color: "#ffcd00",
      secondary: "#1d428a"
    },

    sunderland: {
      name: "Sunderland",
      short: "SUN",
      logo: "assets/clubs-and-countries/sunderland.png",
      color: "#eb172b",
      secondary: "#ffffff"
    }

  };


  /* ============================================================
     CONNECTION
     ============================================================ */

  let peer = null;
  let conn = null;
  let connecting = false;
  let pendingSend = false;


  let state = {

    homeName: "FUL",
    awayName: "MUN",

    homeClub: "fulham",
    awayClub: "manchester-united",

    homeLogo: CLUBS.fulham.logo,
    awayLogo: CLUBS["manchester-united"].logo,

    homeColor: CLUBS.fulham.color,
    homeSecondary: CLUBS.fulham.secondary,

    awayColor: CLUBS["manchester-united"].color,
    awaySecondary: CLUBS["manchester-united"].secondary,

    competitionLogo:
      "assets/competitions/premier-league.png",

    homeScore: 0,
    awayScore: 0,

    elapsedMs: 0,
    running: false,
    startedAt: null

  };


  const $ = id =>
    document.getElementById(id);


  /* ============================================================
     STATUS
     ============================================================ */

  function setStatus(message, connected = false) {

    const status = $("status");

    status.textContent = message;

    status.className =
      connected
        ? "status connected"
        : "status disconnected";

  }


  /* ============================================================
     CLUB PREVIEWS
     ============================================================ */

  function updateClubPreview(side) {

    const select =
      side === "home"
        ? $("homeClub")
        : $("awayClub");

    const club =
      CLUBS[select.value];

    if (!club) return;


    if (side === "home") {

      $("homePreview").src =
        club.logo;

      $("homePreviewName").textContent =
        $("homeName").value ||
        club.short;

      $("homeStyle").textContent =
        "Scoreboard style: " +
        club.color +
        " / " +
        club.secondary;

    } else {

      $("awayPreview").src =
        club.logo;

      $("awayPreviewName").textContent =
        $("awayName").value ||
        club.short;

      $("awayStyle").textContent =
        "Scoreboard style: " +
        club.color +
        " / " +
        club.secondary;

    }

  }


  /* ============================================================
     COMPETITION PREVIEW
     ============================================================ */

  function updateCompetitionPreview() {

    $("competitionPreview").src =
      $("competition").value;

  }


  /* ============================================================
     SCORE
     ============================================================ */

  function changeScore(side, amount) {

    const input =
      side === "home"
        ? $("homeScore")
        : $("awayScore");

    let value =
      Number(input.value) || 0;

    value += amount;

    if (value < 0) {
      value = 0;
    }

    input.value = value;

  }


  /* ============================================================
     BUILD STATE FROM CONTROLS
     ============================================================ */

  function buildStateFromControls() {

    const homeClub =
      CLUBS[$("homeClub").value];

    const awayClub =
      CLUBS[$("awayClub").value];

    if (!homeClub || !awayClub) {

      setStatus(
        "Invalid club selection.",
        false
      );

      return false;

    }


    state.homeClub =
      $("homeClub").value;

    state.awayClub =
      $("awayClub").value;


    state.homeName =
      $("homeName").value.trim() ||
      homeClub.short;

    state.awayName =
      $("awayName").value.trim() ||
      awayClub.short;


    state.homeLogo =
      homeClub.logo;

    state.awayLogo =
      awayClub.logo;


    state.homeColor =
      homeClub.color;

    state.homeSecondary =
      homeClub.secondary;


    state.awayColor =
      awayClub.color;

    state.awaySecondary =
      awayClub.secondary;


    state.competitionLogo =
      $("competition").value;


    state.homeScore =
      Math.max(
        0,
        Number($("homeScore").value) || 0
      );

    state.awayScore =
      Math.max(
        0,
        Number($("awayScore").value) || 0
      );


    return true;

  }


  /* ============================================================
     APPLY
     ============================================================ */

  function applyChanges() {

    if (!buildStateFromControls()) {
      return;
    }


    /*
     * If we are connected, send immediately.
     */

    if (
      conn &&
      conn.open
    ) {

      sendState();

      return;

    }


    /*
     * Otherwise remember the change and
     * automatically reconnect.
     */

    pendingSend = true;

    setStatus(
      "Connecting to OBS...",
      false
    );

    connect();

  }


  /* ============================================================
     * CONNECT TO OBS
     * ============================================================ */

  function connect() {

    const room =
      $("room").value.trim();

    if (!room) {

      setStatus(
        "Enter a room name.",
        false
      );

      return;

    }


    /*
     * Don't create multiple simultaneous
     * PeerJS connections.
     */

    if (connecting) {
      return;
    }


    if (
      conn &&
      conn.open
    ) {

      setStatus(
        "✓ Connected to OBS",
        true
      );

      if (pendingSend) {

        pendingSend = false;

        sendState();

      }

      return;

    }


    connecting = true;


    /*
     * Clean up old connection.
     */

    if (conn) {

      try {
        conn.close();
      } catch (e) {}

      conn = null;

    }


    if (peer) {

      try {
        peer.destroy();
      } catch (e) {}

      peer = null;

    }


    setStatus(
      "Starting connection...",
      false
    );


    const controlId =
      "scoreboard-" +
      room +
      "-control-" +
      Math.random()
        .toString(36)
        .substring(2, 10);


    peer =
      new Peer(
        controlId,
        {
          debug: 1
        }
      );


    peer.on(
      "open",
      () => {

        console.log(
          "Control Peer opened:",
          controlId
        );


        const displayId =
          "scoreboard-" +
          room +
          "-display";


        setStatus(
          "Connecting to OBS...",
          false
        );


        conn =
          peer.connect(
            displayId,
            {
              reliable: true
            }
          );


        if (!conn) {

          connecting = false;

          setStatus(
            "Could not create OBS connection.",
            false
          );

          return;

        }


        conn.on(
          "open",
          () => {

            connecting = false;


            console.log(
              "Connected to scoreboard:",
              displayId
            );


            setStatus(
              "✓ Connected to OBS",
              true
            );


            /*
             * Send the pending change or
             * current control state.
             */

            if (pendingSend) {

              pendingSend = false;

            }

            sendState();

          }
        );


        conn.on(
          "data",
          data => {

            if (
              !data ||
              data.type !== "state" ||
              !data.state
            ) {
              return;
            }


            state = {
              ...state,
              ...data.state
            };


            /*
             * Update controls from OBS.
             */

            $("homeScore").value =
              state.homeScore;

            $("awayScore").value =
              state.awayScore;


            $("homeName").value =
              state.homeName;

            $("awayName").value =
              state.awayName;


            $("competition").value =
              state.competitionLogo;


            $("homeClub").value =
              state.homeClub ||
              "fulham";

            $("awayClub").value =
              state.awayClub ||
              "manchester-united";


            updateClubPreview("home");
            updateClubPreview("away");
            updateCompetitionPreview();


            renderClock();

          }
        );


        conn.on(
          "close",
          () => {

            connecting = false;

            conn = null;

            setStatus(
              "Disconnected from OBS",
              false
            );

          }
        );


        conn.on(
          "error",
          error => {

            console.error(
              "Connection error:",
              error
            );

            connecting = false;

            setStatus(
              "OBS connection error",
              false
            );

          }
        );

      }
    );


    peer.on(
      "error",
      error => {

        console.error(
          "PeerJS error:",
          error
        );


        connecting = false;


        if (
          error.type ===
          "peer-unavailable"
        ) {

          setStatus(
            "OBS scoreboard not found. Open the OBS scoreboard first.",
            false
          );

        } else {

          setStatus(
            "PeerJS error: " +
            error.type,
            false
          );

        }

      }
    );


    peer.on(
      "disconnected",
      () => {

        console.log(
          "PeerJS server disconnected."
        );

      }
    );

  }


  /* ============================================================
     SEND STATE
     ============================================================ */

  function sendState() {

    if (
      !conn ||
      !conn.open
    ) {

      setStatus(
        "Not connected to OBS",
        false
      );

      pendingSend = true;

      return false;

    }


    try {

      conn.send({
        type: "state",
        state: {
          ...state
        }
      });


      setStatus(
        "✓ Scoreboard updated in OBS",
        true
      );


      console.log(
        "State sent to OBS:",
        state
      );


      return true;

    } catch (error) {

      console.error(
        "Failed to send state:",
        error
      );


      setStatus(
        "Failed to update OBS",
        false
      );


      return false;

    }

  }


  /* ============================================================
     CLOCK
     ============================================================ */

  function getElapsed() {

    if (
      state.running &&
      state.startedAt !== null
    ) {

      return (
        state.elapsedMs +
        (
          Date.now() -
          state.startedAt
        )
      );

    }

    return state.elapsedMs;

  }


  function renderClock() {

    const totalSeconds =
      Math.floor(
        Math.max(
          0,
          getElapsed()
        ) / 1000
      );


    const minutes =
      Math.floor(
        totalSeconds / 60
      );


    const seconds =
      totalSeconds % 60;


    $("clock").textContent =
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0");

  }


  function startClock() {

    if (state.running) {
      return;
    }


    state.running = true;

    state.startedAt =
      Date.now();


    sendState();

  }


  function pauseClock() {

    if (!state.running) {
      return;
    }


    state.elapsedMs =
      getElapsed();

    state.running = false;

    state.startedAt = null;


    sendState();

  }


  function resetClock() {

    state.elapsedMs = 0;

    state.running = false;

    state.startedAt = null;


    sendState();

  }


  function setTime() {

    const value =
      prompt(
        "Enter match time in minutes:",
        "0"
      );


    if (value === null) {
      return;
    }


    const minutes =
      Math.max(
        0,
        Number(value) || 0
      );


    state.elapsedMs =
      minutes * 60 * 1000;

    state.running = false;

    state.startedAt = null;


    sendState();

  }


  /* ============================================================
     INPUT EVENTS
     ============================================================ */

  $("homeClub").addEventListener(
    "change",
    () => {

      const club =
        CLUBS[$("homeClub").value];

      if (club) {

        $("homeName").value =
          club.short;

      }

      updateClubPreview("home");

    }
  );


  $("awayClub").addEventListener(
    "change",
    () => {

      const club =
        CLUBS[$("awayClub").value];

      if (club) {

        $("awayName").value =
          club.short;

      }

      updateClubPreview("away");

    }
  );


  $("homeName").addEventListener(
    "input",
    () => {

      $("homePreviewName").textContent =
        $("homeName").value;

    }
  );


  $("awayName").addEventListener(
    "input",
    () => {

      $("awayPreviewName").textContent =
        $("awayName").value;

    }
  );


  $("competition").addEventListener(
    "change",
    updateCompetitionPreview
  );


  /* ============================================================
     INITIALISE
     ============================================================ */

  updateClubPreview("home");
  updateClubPreview("away");
  updateCompetitionPreview();

  renderClock();


  setInterval(
    renderClock,
    250
  );


</script>

</body>
</html>
